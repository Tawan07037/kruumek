version: 2
updates:
  # 1. ตรวจสอบความปลอดภัยของ GitHub Actions (แนะนำให้ใส่ไว้เสมอ)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    cooldown:
      default-days: 7 # หน่วงเวลา 7 วัน รอให้ชุมชนตรวจสอบเวอร์ชันใหม่ก่อนอัปเดต
    groups:
      actions-updates:
        patterns:
          - "*"

